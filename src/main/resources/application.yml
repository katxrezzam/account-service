server:
  port: 8082

spring:
  application:
    name: account-service
  mongodb:
    uri: mongodb://localhost:27017/accountdb
  data:
    mongodb:
      auto-index-creation: true

customer-service:
  base-url: http://localhost:8081

bank:
  accounts:
    savings:
      # el enunciado no da un numero, se deja parametrizado en vez de hardcodeado en el codigo
      max-monthly-movements: 5
