spring:
  application:
    name: account-service
  # spring-cloud-starter-config exige spring.config.import por defecto (falla rapido si falta).
  # En tests no debe depender de que config-server este levantado, asi que se desactiva ese
  # chequeo puntual (leccion de customer-service, ver CONVENTIONS.md).
  cloud:
    config:
      import-check:
        enabled: false

eureka:
  client:
    enabled: false

customer-service:
  base-url: http://localhost:8081

card-service:
  base-url: http://localhost:8084

bank:
  accounts:
    savings:
      vip:
        min-daily-average: 500.00
        avg-shortfall-fee: 15.00
    checking:
      maintenance-fee: 15.00
    movements:
      free-monthly-limit: 5
      excess-fee: 5.00
